# =============================================================================
# TREATMENT CENTER - FVD ASSESSMENT APPLICATION
# =============================================================================
name: treatment_center
description: "Structural rapid assessment tool for treatment centers during Ebola and Marburg outbreaks"

# Prevent accidental publishing to pub.dev (remove to make public)
publish_to: "none"

# App version: major.minor.patch+build
version: 1.0.0+1

# =============================================================================
# ENVIRONMENT REQUIREMENTS
# =============================================================================
environment:
  sdk: ^3.7.0 # Minimum Dart SDK version required

# =============================================================================
# DEPENDENCIES
# =============================================================================
dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------------
  # CORE FLUTTER & PLATFORM INTEGRATION
  # ---------------------------------------------------------------------------
  cupertino_icons: ^1.0.8 # iOS-style icons for cross-platform consistency

  # ---------------------------------------------------------------------------
  # UTILITY LIBRARIES (Core Functionality)
  # ---------------------------------------------------------------------------
  equatable: ^2.0.7 # Value equality comparisons (essential for BLoC)
  intl: 0.19.0 # Internationalization and date/number formatting
  uuid: ^4.5.1 # Generate unique identifiers for assessments
  email_validator: ^3.0.0 # Validate email addresses in forms
  http: ^1.4.0 # HTTP client for API communications

  # ---------------------------------------------------------------------------
  # ARCHITECTURE & STATE MANAGEMENT
  # ---------------------------------------------------------------------------
  flutter_bloc: ^9.1.1 # BLoC pattern for predictable state management
  get_it: ^8.0.3 # Service locator for dependency injection
  fpdart: ^1.1.1 # Functional programming tools (Either, Option)

  # ---------------------------------------------------------------------------
  # DATA PERSISTENCE & LOCAL STORAGE
  # ---------------------------------------------------------------------------
  drift: ^2.26.1 # Type-safe SQL database (SQLite wrapper)
  drift_flutter: ^0.2.4 # Flutter integration for Drift database
  shared_preferences: ^2.5.3 # Simple key-value storage for app settings
  path: ^1.8.0 # Manipulate file paths across platforms
  path_provider: ^2.1.5 # Access device file system paths
  path_provider_platform_interface: ^2.1.2 # Platform interface for path provider
  share_plus: ^11.0.0 # Share content with other apps (e.g., assessment reports)

  # ---------------------------------------------------------------------------
  # NETWORKING & CONNECTIVITY
  # ---------------------------------------------------------------------------
  internet_connection_checker: ^3.0.1 # Monitor internet connectivity status

  # ---------------------------------------------------------------------------
  # DATA SERIALIZATION & CODE GENERATION
  # ---------------------------------------------------------------------------
  json_annotation: ^4.9.0 # Annotations for JSON serialization
  freezed_annotation: ^3.0.0 # Annotations for immutable data classes
  freezed: ^3.0.6 # Generate immutable classes and unions

  # ---------------------------------------------------------------------------
  # DOCUMENT GENERATION & FILE HANDLING
  # ---------------------------------------------------------------------------
  pdf: ^3.11.3 # Generate PDF documents for assessments
  open_file: ^3.3.2 # Open files with system default apps
  syncfusion_flutter_xlsio: ^29.2.11 # Excel file generation for structured data

  # ---------------------------------------------------------------------------
  # EMAIL FUNCTIONALITY
  # ---------------------------------------------------------------------------
  mailer: ^6.4.1 # Send emails programmatically
  flutter_email_sender: ^7.0.0 # Send emails using device's native email apps

  # ---------------------------------------------------------------------------
  # FIREBASE SERVICES (Backend as a Service)
  # ---------------------------------------------------------------------------
  firebase_core: ^2.32.0 # Firebase core SDK (required for all Firebase services)
  firebase_storage: ^11.6.5 # Cloud file storage for assessment documents
  cloud_functions: ^4.7.5 # Serverless functions for email sending & processing

  # ---------------------------------------------------------------------------
  # USER INTERFACE & FORMS
  # ---------------------------------------------------------------------------
  responsive_framework: ^1.5.1 # Responsive layouts for different screen sizes
  flutter_form_builder: ^10.0.1 # Dynamic form generation for assessments
  form_builder_validators: ^11.1.2 # Pre-built validators for form fields
  circle_stepper: ^1.0.4 # Circular progress stepper for multi-step forms
  xml: ^6.5.0
  archive: ^3.6.1
  meta: ^1.16.0

# =============================================================================
# DEVELOPMENT DEPENDENCIES
# =============================================================================
dev_dependencies:
  flutter_test:
    sdk: flutter # Flutter's built-in testing framework

  # ---------------------------------------------------------------------------
  # DATABASE CODE GENERATION
  # ---------------------------------------------------------------------------
  drift_dev: ^2.26.1 # Code generator for Drift database classes
  sqlite3: ^2.1.0 # SQLite3 bindings for development/testing
  permission_handler: ^12.0.0+1

  # ---------------------------------------------------------------------------
  # TESTING & MOCKING
  # ---------------------------------------------------------------------------
  mockito: ^5.4.6 # Mock objects for unit testing
  test_cov_console: ^0.2.2 # Pretty test coverage reports in terminal

  # ---------------------------------------------------------------------------
  # CODE GENERATION & BUILD TOOLS
  # ---------------------------------------------------------------------------
  build_runner: ^2.4.15 # Runs code generators (Drift, Freezed, JSON)

  # ---------------------------------------------------------------------------
  # CODE QUALITY & LINTING
  # ---------------------------------------------------------------------------
  flutter_lints: ^5.0.0 # Recommended lint rules for Flutter

# =============================================================================
# FLUTTER CONFIGURATION
# =============================================================================
flutter:
  uses-material-design: true # Include Material Design icons font

  # ---------------------------------------------------------------------------
  # ASSETS (Images, Files, etc.)
  # ---------------------------------------------------------------------------
  assets:
    - assets/templates/
    - assets/templates/fvd_assessment_template.docx
    - assets/fonts/NotoSans-Regular.ttf # Custom font for UI
    - assets/fonts/NotoSans-Bold.ttf # Custom bold font for UI
    - assets/fonts/NotoSans-Italic.ttf # Custom italic font for UI
    - assets/images/logo.png # Application logo
    # Add additional assets here as needed:
    # - assets/images/
    # - assets/documents/

  # ---------------------------------------------------------------------------
  # CUSTOM FONTS (Uncomment and configure as needed)
  # ---------------------------------------------------------------------------
  # fonts:
  #   - family: CustomFont                   # Font family name
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700

# =============================================================================
# DEPENDENCY NOTES & COMPATIBILITY
# =============================================================================
#
# Firebase Compatibility:
# - firebase_core: ^2.32.0 works with firebase_storage: ^11.6.5
# - These versions are stable and tested together
#
# Architecture Notes:
# - Using BLoC pattern with flutter_bloc for state management
# - Drift for type-safe database operations
# - Get_it for dependency injection
# - Fpdart for functional programming patterns
#
# Document Generation:
# - PDF generation for assessment reports
# - DOCX template support for standardized documents
# - Email functionality for sharing assessments
#
# Testing Strategy:
# - Unit tests with mockito for mocking dependencies
# - Integration tests for critical user flows
# - Code coverage reporting with test_cov_console
#
# =============================================================================
